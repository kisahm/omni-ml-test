apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-inference-cluster
  labels:
    app: llm-inference
    component: inference
    location: cluster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-inference
      location: cluster

  template:
    metadata:
      labels:
        app: llm-inference
        component: inference
        location: cluster
    spec:
      containers:
      - name: inference-server
        image: kisahm/ml-app:latest
        imagePullPolicy: Always

        command: ["python", "src/inference.py"]

        ports:
        - containerPort: 8000
          name: http
          protocol: TCP

        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "8"
            nvidia.com/gpu: "1"

        volumeMounts:
        - name: cache-volume
          mountPath: /app/.cache

        env:
        - name: MODEL_NAME
          value: "microsoft/Phi-3-mini-4k-instruct"
        - name: MAX_MODEL_LEN
          value: "4096"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"
        - name: HF_HOME
          value: "/app/.cache/huggingface"

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 50Gi

      # Schedule on cast.ai GPU nodes (in-cluster)
      nodeSelector:
        scheduling.cast.ai/node-template: "gpu-test-incluster"

      tolerations:
      - key: "scheduling.cast.ai/node-template"
        value: "gpu-test-incluster"
        effect: "NoSchedule"
        operator: "Equal"

---
apiVersion: v1
kind: Service
metadata:
  name: llm-inference-cluster-service
  labels:
    app: llm-inference
    location: cluster
spec:
  type: ClusterIP
  selector:
    app: llm-inference
    location: cluster
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http

---
apiVersion: v1
kind: Service
metadata:
  name: llm-inference-lb
  labels:
    app: llm-inference
spec:
  type: LoadBalancer
  selector:
    app: llm-inference
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
