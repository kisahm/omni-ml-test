apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference-cluster
  labels:
    app: ml-inference
    component: inference
    location: cluster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-inference
      location: cluster

  template:
    metadata:
      labels:
        app: ml-inference
        component: inference
        location: cluster
    spec:
      containers:
      - name: inference-server
        image: kisahm/ml-app:latest
        imagePullPolicy: Always

        command: ["python", "src/inference.py"]

        ports:
        - containerPort: 8000
          name: http
          protocol: TCP

        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "1"

        volumeMounts:
        - name: model-storage
          mountPath: /models
          readOnly: true

        env:
        - name: MODEL_PATH
          value: "/models/model.pth"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: ml-models-pvc

      # Schedule on GPU nodes in the cluster
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: accelerator
                operator: In
                values:
                - nvidia-gpu
                - gpu
              - key: node-location
                operator: In
                values:
                - cluster
                - central

        # Prefer to spread across different nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ml-inference
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: ml-inference-cluster-service
  labels:
    app: ml-inference
    location: cluster
spec:
  type: ClusterIP
  selector:
    app: ml-inference
    location: cluster
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http

---
apiVersion: v1
kind: Service
metadata:
  name: ml-inference-lb
  labels:
    app: ml-inference
spec:
  type: LoadBalancer
  selector:
    app: ml-inference
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
