apiVersion: batch/v1
kind: Job
metadata:
  name: ml-training-job
  labels:
    app: ml-training
    component: training
spec:
  # Keep failed pods for debugging
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400  # Clean up after 24 hours

  template:
    metadata:
      labels:
        app: ml-training
        component: training
    spec:
      restartPolicy: OnFailure

      containers:
      - name: trainer
        image: your-registry/ml-app:latest  # Replace with your image
        imagePullPolicy: Always

        command: ["python", "src/train.py"]
        args:
          - "--epochs=10"
          - "--batch-size=128"
          - "--lr=0.1"
          - "--save-path=/models/model.pth"
          - "--data-dir=/data"

        resources:
          requests:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "1"  # Request 1 GPU
          limits:
            memory: "16Gi"
            cpu: "8"
            nvidia.com/gpu: "1"  # Limit to 1 GPU

        volumeMounts:
        - name: model-storage
          mountPath: /models
        - name: data-storage
          mountPath: /data

        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"

      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: ml-models-pvc
      - name: data-storage
        persistentVolumeClaim:
          claimName: ml-data-pvc

      # Node affinity for GPU nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: accelerator
                operator: In
                values:
                - nvidia-gpu
                - gpu

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-models-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard  # Adjust based on your cluster

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-data-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard  # Adjust based on your cluster
