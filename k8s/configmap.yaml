apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-config
data:
  # Training configuration
  EPOCHS: "10"
  BATCH_SIZE: "128"
  LEARNING_RATE: "0.1"

  # Inference configuration
  HOST: "0.0.0.0"
  PORT: "8000"
  MODEL_PATH: "/models/model.pth"

  # GPU configuration
  CUDA_VISIBLE_DEVICES: "0"
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
