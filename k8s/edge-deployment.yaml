apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference-edge
  labels:
    app: ml-inference
    component: inference
    location: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-inference
      location: edge

  template:
    metadata:
      labels:
        app: ml-inference
        component: inference
        location: edge
    spec:
      containers:
      - name: inference-server
        image: kisahm/ml-app:latest
        imagePullPolicy: Always

        command: ["python", "src/inference.py"]

        ports:
        - containerPort: 8000
          name: http
          protocol: TCP

        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "1"

        volumeMounts:
        - name: model-storage
          mountPath: /models
          readOnly: true

        env:
        - name: MODEL_PATH
          value: "/models/model.pth"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"
        - name: LOCATION
          value: "edge"

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: ml-models-pvc

      # Schedule ONLY on edge nodes (different region)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: accelerator
                operator: In
                values:
                - nvidia-gpu
                - gpu
              - key: node-location
                operator: In
                values:
                - edge
                - remote

        # Prefer to spread across different edge nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ml-inference
                - key: location
                  operator: In
                  values:
                  - edge
              topologyKey: kubernetes.io/hostname

      # Tolerate edge node taints (if any)
      tolerations:
      - key: "node-role.kubernetes.io/edge"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "high-latency"
        operator: "Exists"
        effect: "NoSchedule"

---
apiVersion: v1
kind: Service
metadata:
  name: ml-inference-edge-service
  labels:
    app: ml-inference
    location: edge
spec:
  type: ClusterIP
  selector:
    app: ml-inference
    location: edge
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
