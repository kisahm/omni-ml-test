apiVersion: v1
kind: Namespace
metadata:
  name: edge
  labels:
    omni.cast.ai/enable-scheduling: "true"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-inference-edge
  namespace: edge
  labels:
    app: llm-inference
    component: inference
    location: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-inference
      location: edge

  template:
    metadata:
      labels:
        app: llm-inference
        component: inference
        location: edge
    spec:
      containers:
      - name: inference-server
        image: kisahm/ml-app:v0.0.9
        imagePullPolicy: Always

        command: ["python", "src/inference.py"]

        ports:
        - containerPort: 8000
          name: http
          protocol: TCP

        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "8"
            nvidia.com/gpu: "1"

        volumeMounts:
        - name: cache-volume
          mountPath: /app/.cache

        env:
        - name: MODEL_NAME
          value: "microsoft/Phi-3-mini-4k-instruct"
        - name: MAX_MODEL_LEN
          value: "4096"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"
        - name: HF_HOME
          value: "/app/.cache/huggingface"
        - name: LOCATION
          value: "edge"
        - name: VLLM_DTYPE
          value: "half"  # Use float16 for Tesla T4 (compute capability 7.5)

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 50Gi

      # Schedule on cast.ai GPU nodes (edge)
      nodeSelector:
        scheduling.cast.ai/node-template: "gpu-test-edge"
        topology.kubernetes.io/region: ap-southeast-1
      tolerations:
      - key: "scheduling.cast.ai/node-template"
        value: "gpu-test-edge"
        effect: "NoSchedule"
        operator: "Equal"

---
apiVersion: v1
kind: Service
metadata:
  name: llm-inference-edge-service
  namespace: edge
  labels:
    app: llm-inference
    location: edge
spec:
  type: ClusterIP
  selector:
    app: llm-inference
    location: edge
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
